version: '3.8'

services:
  # Base de Datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: physis_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tickets_db}
      POSTGRES_USER: ${POSTGRES_USER:-physis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-physis_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-physis_admin} -d ${POSTGRES_DB:-tickets_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API & AI OCR Gateway (Express)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: physis_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_PRIMARY_MODEL: gemini-2.5-flash-lite
      GEMINI_FALLBACK_MODEL: gemini-2.5-flash
      ALLOWED_ORIGINS: https://autoscaner.pro,https://portal.autoscaner.pro,https://api.autoscaner.pro
      DATABASE_URL: postgresql://${POSTGRES_USER:-physis_admin}:${POSTGRES_PASSWORD:-physis_secure_password_2026}@postgres:5432/${POSTGRES_DB:-tickets_db}
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    ports:
      - "3000:3000"

  # Frontend Dashboard Validator (Angular + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: physis_validator_frontend
    restart: always
    ports:
      - "8080:80"

volumes:
  postgres_data:
  backend_data:
  backend_uploads:
